<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo 1 - Registro de Tutores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 680px;">
    <h1 class="h3 mb-1">Módulo 1: Registro de Tutores y Animales</h1>
    <p class="text-muted mb-4">HU-01 · Registro de tutor integrado con el Núcleo</p>

    <!-- Paso 1: Inicio de sesión -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">1. Iniciar sesión (Núcleo)</h2>
          <button id="btn-logout" class="btn btn-outline-secondary btn-sm d-none">Cerrar sesión</button>
        </div>

        <form id="form-login" class="row g-3" autocomplete="off">
          <div class="col-md-6">
            <label for="login-rut" class="form-label">RUT</label>
            <input type="text" id="login-rut" class="form-control"
              autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="col-md-6">
            <label for="login-clave" class="form-label">Clave</label>
            <input type="password" id="login-clave" class="form-control"
              autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="col-12">
            <button type="submit" id="btn-login" class="btn btn-primary w-100">Iniciar sesión</button>
          </div>
        </form>

        <div id="sesion-info" class="alert alert-success mt-3 mb-0 d-none"></div>
        <div id="login-error" class="alert alert-danger mt-3 mb-0 d-none"></div>
      </div>
    </div>

    <!-- Paso 2: Formulario HU-01 -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">2. Registrar tutor (HU-01)</h2>

        <form id="form-tutor" class="row g-3" autocomplete="off">
          <div class="col-12">
            <label for="tutor-rut" class="form-label">RUT del tutor (sin puntos, con guión)</label>
            <input type="text" id="tutor-rut" class="form-control"
              autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="col-md-6">
            <label for="tutor-comuna" class="form-label">Comuna</label>
            <input type="text" id="tutor-comuna" class="form-control"
              autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="col-md-6">
            <label for="tutor-telefono" class="form-label">Teléfono</label>
            <input type="text" id="tutor-telefono" class="form-control"
              autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="tel" required>
          </div>
          <div class="col-12">
            <button type="submit" id="btn-registrar" class="btn btn-success w-100" disabled>
              Registrar tutor
            </button>
          </div>
        </form>

        <div id="tutor-resultado" class="alert mt-3 mb-0 d-none"></div>
      </div>
    </div>

    <!-- Paso 3: Formulario HU-02 -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">3. Crear ficha de mascota (HU-02)</h2>

        <form id="form-animal" class="row g-3" autocomplete="off" novalidate>
          <div class="col-md-6">
            <label for="animal-nombre" class="form-label">Nombre</label>
            <input type="text" id="animal-nombre" class="form-control" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="col-md-6">
            <label for="animal-especie" class="form-label">Especie</label>
            <input type="text" id="animal-especie" class="form-control" placeholder="perro, gato..." autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="col-md-6">
            <label for="animal-raza" class="form-label">Raza</label>
            <input type="text" id="animal-raza" class="form-control" placeholder="Labrador Retriever o Mestizo" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="col-md-6">
            <label for="animal-color" class="form-label">Color</label>
            <input type="text" id="animal-color" class="form-control" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="col-12 d-none" id="grupo-raza-observada">
            <label for="animal-raza-observada" class="form-label">Raza observada (mestizo, texto libre)</label>
            <input type="text" id="animal-raza-observada" class="form-control" autocomplete="off" autocapitalize="off" spellcheck="false">
          </div>
          <div class="col-md-6">
            <label for="animal-sexo" class="form-label">Sexo</label>
            <select id="animal-sexo" class="form-select" required>
              <option value="">Selecciona...</option>
              <option value="macho">Macho</option>
              <option value="hembra">Hembra</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="animal-edad" class="form-label">Edad aproximada (años)</label>
            <input type="number" id="animal-edad" class="form-control" min="0" max="40" step="1" required>
          </div>

          <!-- Solo para funcionario / admin / comunitario -->
          <div class="col-12 d-none" id="grupo-comunitario">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="animal-comunitario">
              <label class="form-check-label" for="animal-comunitario">Animal comunitario (sin tutor, con responsable)</label>
            </div>
          </div>
          <div class="col-12 d-none" id="grupo-rut-destino">
            <label for="animal-rut-destino" id="label-rut-destino" class="form-label">RUT del tutor</label>
            <input type="text" id="animal-rut-destino" class="form-control" autocomplete="off" autocapitalize="off" spellcheck="false">
          </div>

          <div class="col-12">
            <button type="submit" id="btn-animal" class="btn btn-success w-100" disabled>Crear ficha</button>
          </div>
        </form>

        <div id="animal-resultado" class="alert mt-3 mb-0 d-none"></div>
      </div>
    </div>

    <!-- Paso 4: Consulta por animalId (HU-03) -->
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h2 class="h5 mb-3">4. Consultar mascota por ID (HU-03)</h2>

        <form id="form-consulta-animal" class="row g-2" autocomplete="off">
          <div class="col-sm-8">
            <label for="consulta-animal-id" class="form-label visually-hidden">ID del animal</label>
            <input type="text" id="consulta-animal-id" class="form-control"
              placeholder="Ej: A-000123" autocomplete="off" spellcheck="false" required>
          </div>
          <div class="col-sm-4">
            <button type="submit" id="btn-consultar-animal" class="btn btn-dark w-100">
              Consultar ID
            </button>
          </div>
        </form>

        <div id="consulta-meta" class="alert alert-secondary mt-3 mb-2 py-2 d-none">
          <strong>HTTP:</strong> <span id="consulta-http-code">-</span> &nbsp;|&nbsp;
          <strong>Tiempo:</strong> <span id="consulta-tiempo">-</span>
        </div>

        <div id="consulta-ficha" class="border rounded bg-white p-3 mb-2 d-none"></div>

        <pre id="consulta-json" class="bg-dark text-light p-3 rounded mb-0 d-none" style="font-size: 0.85rem; overflow-x: auto;"></pre>
      </div>
    </div>

  </div>

  <script>
    let tokenActual = null;
    let perfilActual = null;

    const formLogin = document.getElementById("form-login");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");
    const sesionInfo = document.getElementById("sesion-info");
    const loginError = document.getElementById("login-error");

    const formTutor = document.getElementById("form-tutor");
    const btnRegistrar = document.getElementById("btn-registrar");
    const tutorRutInput = document.getElementById("tutor-rut");
    const tutorResultado = document.getElementById("tutor-resultado");


    const formAnimal = document.getElementById("form-animal");
    const btnAnimal = document.getElementById("btn-animal");
    const animalResultado = document.getElementById("animal-resultado");
    const grupoRazaObs = document.getElementById("grupo-raza-observada");
    const grupoComunitario = document.getElementById("grupo-comunitario");
    const grupoRutDestino = document.getElementById("grupo-rut-destino");
    const chkComunitario = document.getElementById("animal-comunitario");
    const inputRaza = document.getElementById("animal-raza");

    formLogin.reset();
    formTutor.reset();
    formAnimal.reset();
    window.addEventListener("pageshow", () => {
      formLogin.reset();
      formTutor.reset();
      formAnimal.reset();
    });

    function mostrarAlerta(elemento, tipo, texto) {
      elemento.className = `alert alert-${tipo} mt-3 mb-0`;
      elemento.textContent = texto;
    }

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("d-none");
      tutorResultado.classList.add("d-none");
      btnLogin.disabled = true;
      btnLogin.textContent = "Conectando con el Núcleo...";

      const rut = document.getElementById("login-rut").value.trim();
      const clave = document.getElementById("login-clave").value;

      try {
        const resp = await fetch("/api/registro/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rut, clave }),
        });
        const data = await resp.json();

        if (!resp.ok) {
          const msg = data.error ? `${data.error.codigo}: ${data.error.mensaje}` : "Credenciales inválidas";
          mostrarAlerta(loginError, "danger", msg);
          return;
        }

        tokenActual = data.token;
        const u = data.usuario || {};
        perfilActual = u.perfil || null;
        configurarFormularioAnimal();
        mostrarAlerta(
          sesionInfo,
          "success",
          `Sesión activa: ${u.nombre || rut} (${u.perfil || "usuario"}) — RUT ${u.rut || rut}`
        );

        formLogin.classList.add("d-none");
        btnLogout.classList.remove("d-none");
        btnRegistrar.disabled = false;
        btnAnimal.disabled = false;
      } catch (err) {
        mostrarAlerta(loginError, "danger", "Error de red al conectar con el servidor.");
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "Iniciar sesión";
      }
    });

    btnLogout.addEventListener("click", () => {
      tokenActual = null;
      perfilActual = null;
      formLogin.reset();
      formTutor.reset();
      formAnimal.reset();
      animalResultado.classList.add("d-none");
      btnAnimal.disabled = true;
      formLogin.classList.remove("d-none");
      btnLogout.classList.add("d-none");
      sesionInfo.classList.add("d-none");
      tutorResultado.classList.add("d-none");
      btnRegistrar.disabled = true;
    });

    formTutor.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!tokenActual) {
        mostrarAlerta(tutorResultado, "warning", "Primero debes iniciar sesión.");
        return;
      }

      btnRegistrar.disabled = true;
      btnRegistrar.textContent = "Registrando...";

      const payload = {
        rut: tutorRutInput.value.trim(),
        comuna: document.getElementById("tutor-comuna").value.trim(),
        telefono: document.getElementById("tutor-telefono").value.trim(),
      };

      try {
        const resp = await fetch("/api/registro/tutores", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${tokenActual}`,
          },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();

        if (!resp.ok) {
          const msg = data.error
            ? `[${resp.status}] ${data.error.codigo}: ${data.error.mensaje}`
            : `Error ${resp.status}`;
          mostrarAlerta(tutorResultado, "danger", msg);
          return;
        }

        mostrarAlerta(
          tutorResultado,
          "success",
          `Tutor registrado: ${data.nombre} (${data.rut}) · Comuna: ${data.comuna} · Teléfono: ${data.telefono} · Fecha UTC: ${data.fechaRegistro}`
        );
      } catch (err) {
        mostrarAlerta(tutorResultado, "danger", "No se pudo comunicar con la API.");
      } finally {
        btnRegistrar.disabled = false;
        btnRegistrar.textContent = "Registrar tutor";
      }
    });

    // ---------- HU-02: ficha de mascota ----------
    function configurarFormularioAnimal() {
      const esStaff = perfilActual === "funcionario" || perfilActual === "admin";
      grupoComunitario.classList.toggle("d-none", !esStaff);
      grupoRutDestino.classList.toggle("d-none", !esStaff);
      actualizarRutDestino();
    }

    function actualizarRutDestino() {
      document.getElementById("label-rut-destino").textContent =
        chkComunitario.checked ? "RUT del responsable" : "RUT del tutor";
    }
    chkComunitario.addEventListener("change", actualizarRutDestino);

    inputRaza.addEventListener("input", () => {
      const esMestizo = ["mestizo", "mestiza"].includes(inputRaza.value.trim().toLowerCase());
      grupoRazaObs.classList.toggle("d-none", !esMestizo);
    });

    formAnimal.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!tokenActual) {
        mostrarAlerta(animalResultado, "warning", "Primero debes iniciar sesión.");
        return;
      }

      btnAnimal.disabled = true;
      btnAnimal.textContent = "Creando ficha...";

      const payload = {
        nombre: document.getElementById("animal-nombre").value.trim(),
        especie: document.getElementById("animal-especie").value.trim(),
        raza: inputRaza.value.trim(),
        color: document.getElementById("animal-color").value.trim(),
        sexo: document.getElementById("animal-sexo").value,
        edadAproximada: parseInt(document.getElementById("animal-edad").value, 10),
      };
      if (!grupoRazaObs.classList.contains("d-none")) {
        payload.razaObservada = document.getElementById("animal-raza-observada").value.trim();
      }
      if (perfilActual === "funcionario" || perfilActual === "admin") {
        const rutDestino = document.getElementById("animal-rut-destino").value.trim();
        if (chkComunitario.checked) {
          payload.comunitario = true;
          payload.responsableRut = rutDestino;
        } else {
          payload.tutorRut = rutDestino;
        }
      }

      try {
        const resp = await fetch("/api/registro/animales", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${tokenActual}`,
          },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();

        if (!resp.ok) {
          const msg = data.error
            ? `[${resp.status}] ${data.error.codigo}: ${data.error.mensaje}`
            : `Error ${resp.status}`;
          mostrarAlerta(animalResultado, "danger", msg);
          return;
        }

        mostrarAlerta(
          animalResultado,
          "success",
          `Ficha creada: ${data.animalId} · ${data.nombre} (${data.especie}, ${data.raza || "mestizo"}) · Color: ${data.color} · Estado: ${data.estado} · Fecha UTC: ${data.fechaRegistro}`
        );
        formAnimal.reset();
        grupoRazaObs.classList.add("d-none");
        actualizarRutDestino();
      } catch (err) {
        mostrarAlerta(animalResultado, "danger", "No se pudo comunicar con la API.");
      } finally {
        btnAnimal.disabled = false;
        btnAnimal.textContent = "Crear ficha";
      }
    });
  </script>
</body>
</html>
